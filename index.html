<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dcebe6"><meta name="description" content="雾屿，一段关于旋转、视角与相遇的立体解谜旅程。">
  <title>雾屿 · 初见</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <main id="game" aria-label="雾屿立体解谜游戏">
    <div id="scene" aria-label="点击道路行走，点击红柱操作机关"></div>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand"><svg viewBox="0 0 40 44" fill="none" aria-hidden="true"><path d="M5 34V18L20 9l15 9v16L20 43 5 34Z" stroke="currentColor"/><path d="m5 18 15 9 15-9M20 27v16M13 22V11a7 7 0 0 1 14 0v11" stroke="currentColor"/></svg><span>雾屿</span></div>
      <h1 class="chapter"><button id="chapters" aria-label="选择关卡" aria-expanded="false"><span id="chapter-name">一 · 初见</span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m5 6 3 3 3-3"/></svg></button></h1>
      <nav aria-label="游戏操作">
        <button class="icon-button" id="menu" aria-label="打开目录" title="目录"><svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button>
        <button class="icon-button" id="sound" aria-label="开启声音" title="开启声音" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none"><path d="m11 5-5 4H3v6h3l5 4V5Z"/><path class="sound-wave" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-off" d="m16 9 5 6m0-6-5 6"/></svg></button>
        <button class="icon-button" id="reset" aria-label="重新开始" title="重新开始"><svg viewBox="0 0 24 24" fill="none"><path d="M5 8a8 8 0 1 1-1 7M5 3v5h5"/></svg></button>
        <button class="icon-button" id="help" aria-label="查看玩法" title="查看玩法" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 3v.2"/></svg></button>
      </nav>
    </header>
    <div id="markers" aria-label="场景交互">
      <button id="start-marker" class="world-marker" aria-label="走回起点"><span></span></button>
      <button id="center-marker" class="world-marker active" aria-label="走到平台"><span></span></button>
      <button id="goal-marker" class="world-marker goal" aria-label="走向终点"><span></span></button>
      <button id="bridge-control" class="prop-control" aria-label="旋转桥梁" title="旋转桥梁"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17 8a7 7 0 1 0 2 7M17 3v5h-5"/></svg></button>
      <button id="view-control" class="prop-control view-control" aria-label="切换视角" title="切换视角" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div id="move-target" aria-hidden="true" hidden></div>
    <aside id="level-panel" hidden aria-label="关卡列表"></aside>
    <aside id="help-panel" hidden><p id="help-copy">点击光点，行走。</p><small>Tab 选择 · Enter 操作</small></aside>
    <footer class="controls"><p id="hint" aria-live="polite">点击路径，移动角色</p><button id="stop" aria-label="停下" title="停下" hidden><svg viewBox="0 0 24 24" fill="none"><path d="M9 6v12M15 6v12"/></svg></button></footer>
    <section id="completion" hidden role="dialog" aria-modal="true" aria-labelledby="complete-title"><div class="complete-inner"><div class="completion-symbol">✧</div><h2 id="complete-title">抵达</h2><button id="next">下一关 <span>→</span></button><button id="again" class="text-button">重玩</button><button id="complete-menu" class="text-button">目录</button></div></section>
    <section id="game-menu" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden><div class="menu-inner"><div class="menu-heading"><h2 id="menu-title">目录</h2><span id="menu-progress">0 / 6</span><button id="menu-close" class="icon-button" aria-label="关闭目录"><svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="menu-levels" aria-label="选择关卡"></div><button id="continue">开始</button></div></section>
    <div id="fallback" hidden><h2>暂时无法绘制这座小岛</h2><p>请使用支持 WebGL 的浏览器，并开启硬件加速后重试。</p></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
